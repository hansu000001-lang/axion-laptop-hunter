name: AXION Laptop Hunter scan
on:
  schedule:
    # Avoid the top of the hour, when GitHub reports higher schedule congestion.
    - cron: '2/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: axion-laptop-hunter
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          MAX_PRICE_USD: '1200'
          REQUIRED_RAM_GB: '32'
          REQUIRED_SSD_GB: '1024'
          DATABASE_PATH: data/laptop_hunter.sqlite3
        run: python -m laptop_hunter.scanner
      - name: Persist database only when listings or prices changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/laptop_hunter.sqlite3
          if ! git diff --cached --quiet; then
            git commit -m 'Update laptop deal history'
            git push
          else
            echo 'No meaningful listing or price changes; no database commit needed.'
          fi
      - name: Send Telegram failure notification
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ AXION Laptop Hunter scan failed. Open GitHub Actions to inspect the run log."
          fi
