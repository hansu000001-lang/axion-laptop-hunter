name: AXION monthly repository keepalive
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: axion-laptop-hunter
  cancel-in-progress: false
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record monthly heartbeat
        run: |
          mkdir -p data
          date -u '+%Y-%m-%dT%H:%M:%SZ' > data/repository-heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/repository-heartbeat.txt
          git commit -m 'Monthly monitoring heartbeat'
          git push
      - name: Send monthly Telegram health ping
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=✅ AXION Laptop Hunter monthly heartbeat. GitHub keepalive workflow ran successfully; the scanner is scheduled every five minutes."
          fi
      - name: Send Telegram failure notification
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ AXION monthly keepalive failed. Open GitHub Actions to inspect the run log."
          fi
